# Build profile for arduino-cli: `arduino-cli compile --profile clue day1`.
# Pins the board package and every library so each machine builds the same thing.
# Versions are the latest in the Arduino and Adafruit indexes as of November 2026.
profiles:
  clue:
    fqbn: adafruit:nrf52:cluenrf52840
    platforms:
      - platform: adafruit:nrf52 (1.7.0)
        platform_index_url: https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
    libraries:
      - dir: ../libraries/Quaternion
      - Adafruit Arcada Library (2.5.10)
      - Adafruit LSM6DS (4.7.4)
      - Adafruit LIS3MDL (1.2.5)
      - Adafruit SHT31 Library (2.2.2)
      - Adafruit APDS9960 Library (1.3.1)
      - Adafruit BMP280 Library (3.0.0)
      # Everything below is pulled in by the libraries above.
      - Adafruit GFX Library (1.13.0)
      - Adafruit ST7735 and ST7789 Library (1.12.0)
      - Adafruit ImageReader Library (2.12.0)
      - Adafruit EPD (4.6.14)
      - Adafruit SPIFlash (5.1.1)
      - SdFat - Adafruit Fork (2.3.103)
      - Adafruit NeoPixel (1.15.5)
      - Adafruit WavePlayer Library (1.0.7)
      - Adafruit TouchScreen (1.1.6)
      - Adafruit BusIO (1.17.4)
      - Adafruit Unified Sensor (1.1.15)

default_profile: clue
