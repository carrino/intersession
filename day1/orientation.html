<!doctype html>
<!--
  Shows the CLUE's orientation as a 3D board, live over Web Bluetooth, plus every
  sensor reading behind it. Open in Chrome or Edge (Web Bluetooth is not in
  Safari or Firefox). Opening the file directly works, or serve it with:
  python3 -m http.server
-->
<html>
<head>
  <meta charset="utf-8">
  <title>CLUE Orientation</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
    #ui { position: absolute; top: 1em; left: 1em; }
    table { margin-top: 1em; border-collapse: collapse; font-family: monospace; }
    th, td { padding: 0.2em 0.6em; text-align: right; }
    th { text-align: left; }
    .mag { color: #f0f; }
    .accel { color: #0f0; }
  </style>
</head>
<body>
  <div id="ui">
    <button id="connect">Connect to CLUE</button>
    <span id="status">Not connected</span>
    <table id="data"></table>
    <p>Arrows are drawn in the board's frame: <span class="accel">accel</span> should point straight up,
      <span class="mag">mag</span> should keep pointing the same way in the room as you turn the board.</p>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // Must match the UUIDs in begin_ble.ino.
    const SERVICE_UUID = 'c10e0001-5a7e-4a6b-9f3e-0b6f2d9a1c01';
    const SENSORS_UUID = 'c10e0002-5a7e-4a6b-9f3e-0b6f2d9a1c01';

    // The fields of the CLUE's SensorPacket, in order: name, how many floats, unit.
    const LAYOUT = [
      ['quaternion', 4, 'w x y z'],
      ['accel', 3, 'm/s²'],
      ['gyro', 3, 'rad/s'],
      ['mag', 3, 'µT'],
      ['temperature', 1, '°C'],
      ['pressure', 1, 'hPa'],
      ['humidity', 1, '%'],
      ['color', 4, 'r g b clear'],
      ['mic', 1, 'peak to peak'],
      ['buttons', 1, 'A=1 B=2'],
    ];
    const PACKET_FLOATS = LAYOUT.reduce((sum, [, count]) => sum + count, 0);

    // ---- 3D scene ----
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    document.body.appendChild(renderer.domElement);

    // three.js is y-up by default; the CLUE's frame is z-up, so tell the camera that.
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.up.set(0, 0, 1);
    camera.position.set(0, -4, 2);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(2, -3, 5);
    scene.add(light);

    const board = buildBoard();
    scene.add(board);

    // Sensor vectors are measured in the board's frame, so the arrows live on the board.
    const magArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1.5, 0xff00ff);
    const accelArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 1.5, 0x00ff00);
    board.add(magArrow, accelArrow);

    // A board shaped like the CLUE: x right, y toward the USB plug, z out of the screen.
    function buildBoard() {
      const box = (w, h, d, color) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
      const pcb = box(1.8, 1.8, 0.1, 0x1b5e8c);
      const screen = box(1.0, 1.0, 0.05, 0x111111);
      screen.position.set(0, 0.1, 0.07);
      const usb = box(0.4, 0.3, 0.15, 0xbbbbbb);
      usb.position.set(0, 0.9, 0);
      return new THREE.Group().add(pcb, screen, usb);
    }

    function resize() {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();
    renderer.setAnimationLoop(() => renderer.render(scene, camera));

    // ---- Bluetooth ----
    const status = document.getElementById('status');
    const table = document.getElementById('data');

    async function connect() {
      const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
      device.addEventListener('gattserverdisconnected', () => status.textContent = 'Disconnected');

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      const sensors = await service.getCharacteristic(SENSORS_UUID);
      sensors.addEventListener('characteristicvaluechanged', onPacket);
      await sensors.startNotifications();
      status.textContent = `Connected to ${device.name}`;
    }

    function onPacket(event) {
      const data = event.target.value;
      if (data.byteLength !== PACKET_FLOATS * 4) {
        status.textContent = `Got ${data.byteLength} bytes, expected ${PACKET_FLOATS * 4} (BLE MTU too small?)`;
        return;
      }
      const packet = parsePacket(data);

      const [w, x, y, z] = packet.quaternion;
      board.quaternion.set(x, y, z, w);
      magArrow.setDirection(new THREE.Vector3(...packet.mag).normalize());
      accelArrow.setDirection(new THREE.Vector3(...packet.accel).normalize());
      showTable(packet);
    }

    // Splits the packet's little-endian floats into {name: [values]} following LAYOUT.
    function parsePacket(data) {
      const packet = {};
      let i = 0;
      for (const [name, count] of LAYOUT) {
        packet[name] = [];
        for (let n = 0; n < count; n++) {
          packet[name].push(data.getFloat32(4 * i++, true));
        }
      }
      return packet;
    }

    // One row per field: its values, the vector length for 3-vectors, then the unit.
    function showTable(packet) {
      const cell = v => `<td>${v.toFixed(2)}</td>`;
      table.innerHTML = LAYOUT.map(([name, count, unit]) => {
        const values = packet[name];
        const length = count === 3 ? `<td>|v| ${Math.hypot(...values).toFixed(2)}</td>` : '';
        return `<tr><th class="${name}">${name}</th>${values.map(cell).join('')}${length}<td>${unit}</td></tr>`;
      }).join('');
    }

    if (navigator.bluetooth) {
      document.getElementById('connect').onclick = () => connect().catch(err => status.textContent = err.message);
    } else {
      status.textContent = 'Web Bluetooth needs Chrome or Edge';
    }
  </script>
</body>
</html>
